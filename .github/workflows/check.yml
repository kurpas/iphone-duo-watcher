name: iPhone Duo watcher

on:
  schedule:
    # Backup only: each watch run re-launches the next one itself (last step).
    # Concurrency keeps a single run active at a time.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch = loop 5.5h, once = single check, test = send test notification"
        default: watch
        type: choice
        options: [watch, once, test]
      minutes:
        description: "watch duration in minutes"
        default: "330"

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to re-launch the next watch run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        id: run
        run: |
          case "${{ inputs.mode || 'watch' }}" in
            once) python main.py --once ;;
            test) python main.py --test-notify ;;
            *)    python main.py --duration "${{ inputs.minutes || '330' }}" ;;
          esac
      # Chain: queue the next watch run (starts as soon as this one ends).
      # Skipped when the run is cancelled, so cancelling = stopping.
      - name: Queue next run
        if: ${{ !cancelled() && (inputs.mode || 'watch') == 'watch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.run.outcome }}" = "failure" ]; then sleep 300; fi  # avoid a hot loop on crashes
          gh workflow run check.yml --repo "${{ github.repository }}" -f mode=watch
